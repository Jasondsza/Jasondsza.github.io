baseURL = "https://jasondsza.github.io/"
locale = "en-gb"
title = "Jason | SOC Analyst"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
pygmentsUseClasses = true

[pagination]
  pagerSize = 5

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  description = "Cyber security portfolio: SOC and incident response focused write-ups, projects, and certifications."
  author = "Jason"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowShareButtons = false
  ShowToc = true
  TocOpen = false
  disableScrollToTop = false

  [params.homeInfoParams]
    Title = "Hi, I'm Jason"
    Content = "Recent cyber security graduate focused on blue team detection and incident response. I write up investigations, build small security tools, and document my home SOC lab."

  [[params.socialIcons]]
    name = "github"
    title = "GitHub"
    url = "https://github.com/Jasondsza"

  [[params.socialIcons]]
    name = "linkedin"
    title = "LinkedIn"
    url = "https://www.linkedin.com/in/your-linkedin-handle/"

  [[params.socialIcons]]
    name = "email"
    title = "Email"
    url = "mailto:jasondsouza40481@gmail.com"

[menu]
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 10

  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 20

  [[menu.main]]
    identifier = "writeups"
    name = "Write-ups"
    url = "/writeups/"
    weight = 30

  [[menu.main]]
    identifier = "certs"
    name = "Certifications & CTF"
    url = "/certs/"
    weight = 40

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = true
    codeFences = true
    guessSyntax = true
